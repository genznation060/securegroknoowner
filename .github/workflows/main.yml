name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK Packages & Accept Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" || true
          sdkmanager --channel=3 "platforms;android-37.0" || true
          yes | sdkmanager --channel=3 --licenses > /dev/null || true

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper
          fi
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Kiosk APK
        run: ./gradlew :app:assembleKiosk --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-Kiosk-APK
          path: |
            app/build/outputs/apk/kiosk/**/*.apk
            app/build/outputs/apk/**/kiosk/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-Debug-APK
          path: |
            app/build/outputs/apk/debug/**/*.apk
            app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn
